<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Define o conjunto de caracteres -->
    <meta charset="UTF-8">

    <!-- Título da página -->
    <title>Atividade3-Listar</title>

    <!-- Importa o CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Fundo claro -->

<body class="bg-light">

    <!-- Container principal -->
    <main class="container mt-5">

        <!-- Título da loja -->
        <h1 id="PerfilUsuario" class="text-center mb-4">
            Lista🛒
        </h1>

        <!-- Card do produto -->
        <div class="card">
            <div class="card-body">

                <label for="Additem">Adicione um item a lista</label>
                <input type="text" name="Additem" id="Additem" required><br>

                <button id="btnAdicionar" class="btn btn-success">
                    Cadastrar
                </button>
                <ul class="Lista"></ul>
            </div>
        </div>
    </main>

    <!-- Script JavaScript -->
    <script src="script.js"></script>
</body>

</html>
