<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Define o conjunto de caracteres -->
  <meta charset="UTF-8">

  <!-- Título da página -->
  <title>Atividade1-Cadastro</title>

  <!-- Importa o CSS do Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<!-- Fundo claro -->
<body class="bg-light">

  <!-- Container principal -->
  <main class="container mt-5">

    <!-- Título da loja -->
    <h1 id="PerfilUsuario" class="text-center mb-4">
      Olá!
    </h1>

    <!-- Card do produto -->
    <div class="card">
      <div class="card-body">

         <label for="Digitarnome">Digite seu nome:</label>
            <input type="text" name="nomeCliente" id="nomeCliente" required><br>


        <!-- Botão de compra -->
        <button id="btnCadastrar" class="btn btn-success">
          Cadastrar
        </button>

        <!-- Mensagem de feedback -->
        <p id="mensagem" class="fw-bold"></p>

      </div>
    </div>
  </main>

  <!-- Script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
